[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leaf-conductance"
version = "1.1.0"
description = "Boundary-layer conductance of leaves under free, forced and mixed convection (Graefe et al. 2022 and extensions)"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.9"
dependencies = ["numpy>=1.22"]
authors = [{name = "Jan Graefe", email = "graefe@igzev.de"}]
keywords = ["leaf", "boundary layer", "convection", "Nusselt", "heat transfer", "transpiration"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/Code4Plants/leaf-conductance"
Paper = "https://doi.org/10.1016/j.agrformet.2022.108884"

[tool.setuptools]
package-dir = {"" = "python"}
py-modules = ["graefe_convection"]

[tool.pytest.ini_options]
testpaths = ["python"]
